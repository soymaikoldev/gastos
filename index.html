<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis Gastos</title>
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#20201c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gastos">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&family=Hanken+Grotesk:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="gate" class="gate">
  <div class="gate-box">
    <div class="gate-lock">🔒</div>
    <h1>Mis gastos</h1>
    <p id="gate-msg">Privado y solo tuyo. Conéctate con tu token para empezar.</p>
    <button id="gate-btn" type="button" class="btn-primary">Conectarme</button>
    <p class="gate-sync" id="gate-sync"></p>
  </div>
</div>

<main id="app" hidden></main>

<dialog id="tok" class="tok">
  <form method="dialog" id="tok-form">
    <h2>Conecta este dispositivo</h2>
    <p id="t-msg" class="t-msg"></p>
    <p class="t-help">Pega tu token de GitHub (el mismo del Content Hub y del tablero). Se guarda solo en este navegador.</p>
    <input id="t-input" type="password" placeholder="github_pat_..." autocomplete="off" spellcheck="false">
    <div class="tok-row">
      <button type="button" id="t-cancel" class="btn-ghost">Cancelar</button>
      <button type="submit" class="btn-primary">Guardar</button>
    </div>
  </form>
</dialog>

<script src="script.js"></script>
</body>
</html>
